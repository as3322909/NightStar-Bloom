plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = '[星辉]Nightstar-Bloom' }
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
 inputs.property "version", project.version
 filesMatching("fabric.mod.json") { expand "version": project.version }
}
tasks.named('jar') {
 from('LICENSE')
 from('THIRD-PARTY-NOTICES.md')
 from('licenses') { into 'licenses' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8"; options.release = 21 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

// Dependency-free regression checks for capture lifetime and instance isolation.
tasks.register('poseTest', JavaExec) {
 dependsOn testClasses
 classpath = sourceSets.test.runtimeClasspath
 mainClass = 'com.nightstar.bloom.AxPoseTest'
}
tasks.named('check') { dependsOn 'poseTest' }

// Tests run through poseTest, not the JUnit discovery engine.
tasks.named('test') { failOnNoDiscoveredTests = false }
